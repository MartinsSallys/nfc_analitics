[project]
name = "nfc-analytics"
version = "0.1.0"
description = "Páginas de lojas e métricas de placas NFC/QR"
requires-python = ">=3.12,<3.15"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = ">=0.115,<1.0"
uvicorn = {version = ">=0.30,<1.0", extras = ["standard"]}
jinja2 = ">=3.1,<4.0"
pydantic-settings = ">=2.0,<3.0"
sqlalchemy = ">=2.0,<2.1"
psycopg = {version = ">=3.2,<4.0", extras = ["binary"]}
alembic = ">=1.13,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
httpx = ">=0.27,<1.0"
ruff = ">=0.9,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
